<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мини-магазин{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0; background: #f5f6f8; color: #222;
        }
        header {
            background: #2c3e50; color: #fff; padding: 14px 24px;
            display: flex; align-items: center; gap: 20px;
        }
        header a { color: #fff; text-decoration: none; font-weight: 500; }
        header a:hover { text-decoration: underline; }
        .badge {
            background: #e74c3c; color: #fff; border-radius: 10px;
            padding: 2px 8px; font-size: 12px; margin-left: 4px;
        }
        main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
        .flash.success { background: #d4edda; color: #155724; }
        .flash.error   { background: #f8d7da; color: #721c24; }
        button, .btn {
            cursor: pointer; border: none; border-radius: 6px;
            padding: 8px 14px; font-size: 14px; text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger  { background: #e74c3c; color: #fff; }
        .btn-danger:hover  { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: #fff; }
    </style>
</head>
<body>
<header>
    <a href="{{ url_for('index') }}">🛍 Мини-магазин</a>
    <a href="{{ url_for('cart') }}">Корзина <span class="badge">{{ cart_count|default(0) }}</span></a>
    <a href="{{ url_for('stats') }}">Статистика</a>
</header>
<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
