{% extends "base.html" %}
{% block title %}Каталог{% endblock %}
{% block content %}
<h2>Каталог товаров</h2>

<table style="width:100%; border-collapse: collapse; background:#fff; border-radius:8px; overflow:hidden;">
    <thead style="background:#ecf0f1;">
        <tr>
            <th style="padding:10px; text-align:left;">Название</th>
            <th style="padding:10px;">Категория</th>
            <th style="padding:10px;">Цена</th>
            <th style="padding:10px;">Действие</th>
        </tr>
    </thead>
    <tbody>
    {% for p in products %}
        <tr style="border-top:1px solid #ecf0f1;">
            <td style="padding:10px;">{{ p.name }}</td>
            <td style="padding:10px; text-align:center;">{{ p.category }}</td>
            <td style="padding:10px; text-align:right;">{{ p.price|price }}</td>
            <td style="padding:10px; text-align:center;">
                <form method="post" action="{{ url_for('add_to_cart', product_id=p.id) }}" style="display:inline;">
                    <button class="btn-primary" type="submit">Добавить в корзину</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
