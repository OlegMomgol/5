<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Список дел{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-bs-theme', saved);
        })();
    </script>
</head>
<body>

<nav class="navbar navbar-expand-lg border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Список дел</a>
        <div class="d-flex align-items-center gap-2">
            <a href="{{ url_for('add_task') }}" class="btn btn-primary btn-sm">+ Задача</a>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" title="Переключить тему"></button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');

    function updateIcon() {
        toggle.textContent = root.getAttribute('data-bs-theme') === 'dark' ?;
    }
    updateIcon();

    toggle.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
